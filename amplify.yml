version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
        - node scripts/fix-cognito-email-config.js
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/what-when-where
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
