type UserProfile @model
  @auth(rules: [
    { allow: private, operations: [create, read, update, delete] }
  ]) {
  id: ID!
  ownerSub: String!
  phone: String
}

# Occasion access is enforced server-side:
# - The model is Cognito-only (allow: private), so the public API key can't read,
#   write or subscribe to occasions at all.
# - The generated getOccasion/listOccasions queries are disabled. They are replaced
#   by the custom queries below (resolver in stacks/CustomResources.json), which
#   return only occasions the caller owns, is a respondent on, or that allow public
#   access, and (for the list) that qualify for the effective date.
type Occasion @model(queries: { get: null, list: null })
  @auth(rules: [{ allow: private }]) {
  id: ID!
  ownerSub: String!
  ownerEmail: String!
  ownerName: String!
  title: String!
  description: String!
  status: String!
  occasionType: String
  respondents: AWSJSON
  whenOptions: AWSJSON
  whereOptions: AWSJSON
  finalDate: String
  finalStartTime: String
  finalEndTime: String
  finalEndDate: String
  finalLocation: String
  finalNotes: String
  infoText: String
  infoUrl: String
  allowPublic: Boolean
  playerOfDayVotes: AWSJSON
  playerOfDayDeadline: String
}

type OccasionPage @aws_cognito_user_pools {
  items: [Occasion!]!
  nextToken: String
}

type Query {
  # Returns the occasion only if the caller can access it (owner, respondent, or
  # allowPublic). No date filter, so links to past occasions keep working.
  # Call with the Cognito ID token so the resolver can read the email claim.
  # (Named differently from the disabled generated getOccasion so the deploy
  # doesn't collide with its resolver.)
  getAccessibleOccasion(id: ID!): Occasion @aws_cognito_user_pools

  # Occasions the caller can access whose date (finalDate/finalEndDate, else the
  # latest When option date/endDate) is on or after effectiveDate, plus occasions
  # with no dates yet. Pages may be short or empty: keep calling while nextToken
  # is non-null. Call with the Cognito ID token (see getAccessibleOccasion).
  listOccasionsForUser(effectiveDate: AWSDate!, limit: Int, nextToken: String): OccasionPage! @aws_cognito_user_pools
}
